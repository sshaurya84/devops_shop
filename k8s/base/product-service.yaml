apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: devops-shop
spec:
  selector: { app: product-service }
  ports: [{ port: 3001, targetPort: 3001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: devops-shop
spec:
  replicas: 2
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
    spec:
      containers:
        - name: product-service
          image: 029633610454.dkr.ecr.us-east-1.amazonaws.com/devops-shop/product-service:1ce8a4b0c252
          ports: [{ containerPort: 3001 }]
          env:
            - name: PORT
              valueFrom: { configMapKeyRef: { name: product-service-config, key: PORT } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
            - name: DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/ecommerce
          readinessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 15 }
