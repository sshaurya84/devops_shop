apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-shop-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sshaurya84/devops_shop.git
    targetRevision: main
    path: k8s/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
