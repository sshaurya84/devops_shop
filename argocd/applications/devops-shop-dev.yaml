apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-shop-dev
  namespace: argocd
  finalizers:
    # Delete managed resources before deleting this Application.
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://github.com/sshaurya84/devops_shop.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-shop
  syncPolicy:
    # Git commits now deploy automatically. Prune applies only to resources
    # tracked by this Application; the locally-created database Secret is not
    # tracked and will not be deleted.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
